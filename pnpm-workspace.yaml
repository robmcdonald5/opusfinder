packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  workerd: true
  sharp: false
  # Transitive via inngest's `connect` feature; we use the HTTP `serve` path (inngest/node), which never
  # loads protobufjs. Its postinstall is a no-op version-warn helper (produces no artifact), and the
  # runtime require() API works with the build skipped regardless — so unbuilt is safe (like sharp).
  protobufjs: false

# Allowlist of deps permitted to run install/build scripts (pnpm 10+ blocks by
# default). Moved here from package.json's "pnpm" field, which pnpm 11 ignores.
# workerd is wrangler's Workers runtime (apps/scrapers); sharp is an optional
# wrangler image dep our cron-only Worker never uses, so it stays unbuilt.
onlyBuiltDependencies:
  - esbuild
  - workerd
