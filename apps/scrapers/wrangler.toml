name = "opusfinder-scrapers"
main = "src/index.ts"
compatibility_date = "2026-06-03"
# No compatibility_flags: the Worker imports only fetch-based libraries (neon-http, the ATS adapters,
# discovery) — no Node-targeted package enters the bundle, so nodejs_compat is not needed. Enabling
# inline embedding later re-introduces @opusfinder/embeddings' dotenv env-module and would need
# `compatibility_flags = ["nodejs_compat"]` — see src/index.ts.

[observability]
enabled = true

[limits]
# CPU time per invocation. Cloudflare's DEFAULT is 30s of CPU — and CPU time is COMPUTE ONLY (not
# wall-clock), accumulated CUMULATIVELY across the whole invocation. A dense ingestion chunk (~130
# boards each parsing + htmlToText-cleaning hundreds of postings) burns >30s of CPU and is hard-killed
# BEFORE finishRun. That kill is UNCATCHABLE, so the KV cursor never advances and the same poison
# chunk re-runs every tick forever (the 2026-06-16 outage, frozen at cursor 1436). Neither adapter.maxItems
# (a PER-BOARD posting cap) nor maxRunMs (a between-boards WALL-clock budget) bounds CPU. Raise to the
# 5-min (300,000 ms) maximum so a heavy chunk completes — or cleanly hits the 10-min maxRunMs wall
# budget and PARTIALLY advances the cursor — instead of dying mid-chunk. Subrequests are NOT the limit
# (Workers Paid = 10,000/invocation). `cpu_ms` requires the Standard Usage Model (this account is
# Workers Paid/Standard). The lossless deeper fix (per-board offset pagination + per-board cursor
# checkpoint) is a follow-up PR.
cpu_ms = 300000

[triggers]
# SCHEDULING TOGGLE — pause/resume the deployed cron (see README "Pause / resume the schedule").
#   PAUSED  : crons = []         + `wrangler deploy`  -> removes the deployed triggers; nothing fires.
#   RUNNING : restore the array  + `wrangler deploy`  -> re-registers the triggers.
# An idle Worker costs nothing and never touches Neon. `crons = []` is the documented way to REMOVE
# triggers; omitting [triggers] entirely would instead LEAVE the deployed ones untouched.
#
# >>> RESUMED in Phase F6 (the liveness DRIVER for the F6 health checker + the watchdog heartbeat). <<<
# Ingestion runs EVERY 2 HOURS (*/30 → hourly in F6 → 2-hourly, 2026-10). The tick is chunked
# (INGEST_LIMIT boards per fire, KV cursor). Why 2 h: Neon bills per awake minute, and the ingestion tick
# is what keeps it awake — each tick holds it up for the tick itself PLUS a fixed 5-min autosuspend tail,
# so the tail alone cost 24 × 5 min = 2 h/day hourly. Half the wakes with a bigger chunk per wake (see
# INGEST_LIMIT below) re-fetches each board nearly as often (3,000 vs 3,600 board fetches/day) for far
# fewer awake hours. 2-hourly is ample freshness for a daily/weekly digest. Discovery RESUMED in Phase F5 (2026-06-15): Workers Paid is
# active, so the weekly Sunday tick runs the workerSafe lanes (outscal + hn) via
# runDiscovery({ workerOnly: true }).
# (UTC; CF weekdays are 1=Sun..7=Sat — Sunday is "SUN", never "0"; the strings MUST match the `case`
# literals in src/index.ts character-for-character — src/dispatch.test.ts reads this array and fails on
# drift. USER: `wrangler deploy` to register the trigger, and set the external watchdog's expected period
# to 2 h — an hourly-period check would page on every healthy gap.)
crons = [
  "0 */2 * * *", # ingestion — every 2 h, at :00 of even UTC hours
  "0 3 * * SUN", # discovery — Sunday 03:00 (Workers Paid; F5f resumed) — workerSafe lanes via workerOnly:true
]

[vars]
# Non-secret config only. The secret (DATABASE_URL) is set with `wrangler secret put` and arrives as
# env.DATABASE_URL.
# Boards per ingestion tick. 150 -> 250 with the 2-hourly cron (2026-10). Sized so a NORMAL tick ends well
# inside the 10-min MAX_RUN_MS budget (src/index.ts), leaving the graceful budget stop (cursor advances
# past the boards that ran; the rest carry to the next tick) as the fallback for a slow chunk:
#   measured (hourly x 150): median tick 5.2 min wall = 2.08 s/board, of which 0.5 s is the inter-board
#     pace sleep (149 x 0.5 s = 75 s, ~24% of the tick) => ~1.58 s/board of ATS fetch + ~5 neon-http
#     round trips + CPU.
#   - the dropped per-board upsertCompany round trip   => ~ -0.1 s  (~1.48 s/board)
#   - pace per source by TIME (a board waits only what's left of 0.5 s since its source's last board
#     started) => at most 0.5 s x (share of same-source neighbours), and less whenever the previous
#     same-source board itself took time; budgeted at a conservative 0.25 s/board
#   => ~1.7 s/board: 250 boards ~ 7.2 min (72% of the budget, so a tick ~40% slower than the median still
#      completes); 300 would be ~8.7 min (87%), too close to the stop to call "normal".
# A second graceful stop guards subrequests: src/index.ts stops starting boards at 8,000 of Workers Paid's
# 10,000-per-invocation cap (250 normal boards use ~1,500). CPU needs no guard: ~20 s per 250 boards
# (measured max 11.8 s per 150) against cpu_ms = 300,000.
# 250 x 12 ticks = 3,000 board fetches/day vs 3,600 at hourly x 150, so a full sweep of the active boards
# takes ~20% longer (N/250 x 2 h vs N/150 x 1 h). Raise it once `pnpm runs` (started/finished) shows real
# ticks finishing well short of 10 min. History: 150 -> 75 (PR #28, a Neon 512MB-outage misdiagnosis — the real cause was jobs.raw
# storage bloat, fixed in PR #29) -> 150 (2026-06-17). The genuine per-tick protections are cpu_ms above
# + the per-tick Worker budget bounding (PR #27). Matches DEFAULT_INGEST_LIMIT in src/index.ts; clamped to
# MAX_INGEST_LIMIT (500) there.
INGEST_LIMIT = "250"

# F2 lifecycle-close enforcement — the SINGLE switch across all three F2 arms (Arm A per-board sweep +
# Arm B board-death close here in the Worker; Arm C 410-close in the digest runtime). "shadow" = count-only:
# the absence streak is kept and `wouldClose` is tallied, but NO job is written 'closed'. "enforce" writes
# 'closed' at the threshold.
#
# G1 (2026-06-18): flipped to "enforce" after the G1a shadow review — `pnpm --filter @opusfinder/db
# shadow-closes` + an absence-clustering diagnostic showed a 2,482-job (3.65% of active) would-close backlog
# spread across 410 boards at modest per-board fractions (real staleness, NOT an empty-fetch false-absence
# bug). ATOMIC both-runtimes flip (decision 2 — partial flip is the #1 risk): this deploy applies Arms A/B;
# you MUST ALSO set LIFECYCLE_CLOSE_ENFORCE=enforce in the Vercel/Inngest env (Arm C) in the same window. Rollback =
# flip back to "shadow" + redeploy (reversible; a reappearing job revives regardless of the flag).
LIFECYCLE_CLOSE_ENFORCE = "enforce"

# Tier-1 universal staleness close — the completeness-INDEPENDENT lifecycle backstop that closes any active
# job not re-confirmed (last_seen_at, stamped by markJobsPresent) within STALE_SWEEP_TTL_DAYS. This
# is what ends the permanently-capped-mega-board (boschgroup) Arm-A lifecycle exemption: its aged-out tail
# closes on the same clock as every other board (Arm A's set-difference sweep needs a COMPLETE feed and is
# skipped on a capped/partial fetch; this timer needs no complete feed). The sweep runs EVERY tick driven by
# the deployed code; STALE_SWEEP is its OWN enforce switch, SEPARATE from LIFECYCLE_CLOSE_ENFORCE above (so it ships
# shadow even though F2 is already enforced):
#   STALE_SWEEP unset/"shadow" : count-only — tally `staleWouldClose`, write no 'closed' (the SHIPPED default).
#   STALE_SWEEP = "enforce"    : close active jobs past the TTL on STILL-FETCHED boards (+ stamp closed_at for G2).
# Only closes jobs of boards SUCCESSFULLY ingested within the TTL window (the board-health guard in
# sweepStaleJobs), so a board DOWN for >TTL has its live jobs SPARED, not false-closed.
# Flip to "enforce" ONLY after reading `pnpm --filter @opusfinder/db shadow-closes`, which breaks
# `staleWouldClose` down PER BOARD. EXPECT the first enforce to clear a one-time BACKLOG — every healthy capped
# mega-board's accumulated aged-out tail (boschgroup alone is ~thousands of >3-week-old postings); that is the
# feature working, NOT a spike-bug. What to verify: the top per-board contributors are capped mega-boards
# (expected), not a cluster of small boards that recently failed to fetch. Steady-state staleWouldClose should
# settle to a trickle after the first enforce. Unlike F2's atomic three-arm flip, this is a single independent
# switch (one runtime), so no partial-flip footgun. To enable: add STALE_SWEEP = "enforce".
STALE_SWEEP_TTL_DAYS = "21"

# Chunk-cursor store for the Option-A chunked-cron ingestion lane. The binding is DECLARED so
# `wrangler dev` simulates a local KV for it (no id needed) and the ingestion tick can read/write the
# cursor locally. A real `wrangler deploy` needs the id — USER step (PHASE_8_PLAN.md §9):
#   wrangler kv namespace create INGEST_CURSOR   # then uncomment `id` below and paste the value
[[kv_namespaces]]
binding = "INGEST_CURSOR"
id = "512214e0882d4816bc397cf092956a66"
